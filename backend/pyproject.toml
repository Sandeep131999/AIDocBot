[project]
name = "backend"
version = "2.0.0"
description = "Enterprise Agentic RAG — LangGraph + FastAPI + MCP + Observability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Core LangChain / LangGraph ──────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=1.0.0",
    "langgraph-checkpoint-postgres>=1.0.0",

    # ── LLM Providers ───────────────────────────────────────────────────
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-anthropic>=0.2.0",

    # ── Vector Stores ────────────────────────────────────────────────────
    "pgvector>=0.3.0",
    "ddgs>=9.0.0",

    # ── Embeddings ───────────────────────────────────────────────────────
    "sentence-transformers>=3.0.0",

    # ── Document Loaders ─────────────────────────────────────────────────
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "docx2txt>=0.8",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "markdownify>=0.13.0",
    "python-pptx>=1.0.0",
    "unstructured>=0.15.0",

    # ── API Framework ────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",

    # ── Auth & Security ──────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",

    # ── Database ─────────────────────────────────────────────────────────
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # ── Observability ────────────────────────────────────────────────────
    "langsmith>=0.1.140",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",

    # ── Guardrails / PII ─────────────────────────────────────────────────
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.8.0",

    # ── Evaluation ───────────────────────────────────────────────────────
    "ragas>=0.1.21",
    "deepeval>=1.4.0",
    "numpy>=1.26.0",

    # ── MCP ──────────────────────────────────────────────────────────────
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",

    # ── Rate Limiting ─────────────────────────────────────────────────────
    "slowapi>=0.1.9",

    # ── Utilities ─────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "rich>=13.8.0",
    "anyio>=4.6.0",
    "cachetools>=5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.5.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
